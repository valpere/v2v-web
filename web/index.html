<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>v2v — AI-консьєрж</title>
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
  <header><h1>v2v</h1><span id="topic-name"></span></header>
  <main>
    <section id="topics" aria-label="Теми"></section>
    <section id="chat" hidden>
      <button id="back" type="button">← Теми</button>
      <div id="log" role="log" aria-live="polite"></div>
      <div id="prompts"></div>
      <form id="form" autocomplete="off">
        <input id="text" maxlength="500" placeholder="Напишіть повідомлення…" required>
        <button type="button" id="mic" hidden aria-label="Голосове повідомлення">🎤</button>
        <button type="submit">Надіслати</button>
      </form>
    </section>
    <section id="catalog" hidden aria-label="Меню">
      <h2>Меню <small id="catalog-count"></small></h2>
      <div id="items"></div>
    </section>
    <aside id="cart" hidden>
      <h2>Кошик</h2>
      <ul id="cart-items"></ul>
      <p id="cart-total"></p>
      <button id="checkout" type="button">Оформити</button>
    </aside>
  </main>
  <script src="assets/app.js"></script>
</body>
</html>
